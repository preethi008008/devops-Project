apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-processor
  namespace: video-analytics
  labels:
    app: video-processor

spec:
  replicas: 3

  selector:
    matchLabels:
      app: video-processor

  template:
    metadata:
      labels:
        app: video-processor

    spec:
      containers:
        - name: video-processor
          image: video-processor:v1
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080

          # Load environment variables from ConfigMap
          envFrom:
            - configMapRef:
                name: video-config

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20

          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false

      # Spread pods across zones for resilience
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: video-processor